name: Package KevFLIX desktop
on:
  push:
    branches: [main]
    paths: ['relay/**', 'web/**', 'tv/**', 'scripts/**', 'installer/**', '*.ps1', '*.cmd', 'requirements.txt', 'package.json', 'config.example.json', '.github/workflows/desktop-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kevflix-desktop-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned portable Python
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/astral-sh/python-build-standalone/releases/download/20261013/cpython-3.11.17%2B20261013-x86_64-pc-windows-msvc-install_only_stripped.tar.gz' -OutFile "$env:RUNNER_TEMP/python-runtime.tar.gz"
      - name: Package without executing the application or tests
        shell: pwsh
        run: |
          python scripts/build_installer.py --source . --runtime "$env:RUNNER_TEMP/python-runtime.tar.gz" --output "$env:RUNNER_TEMP/kevflix-build" --revision "$env:GITHUB_SHA"
          python scripts/package_tv.py --output "$env:RUNNER_TEMP/kevflix-build"
      - name: Publish development download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version-build.$env:GITHUB_RUN_NUMBER"
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          @('KevFLIX development package. Built from the linked source commit; no application, installer, playback, inference or hardware tests were run.', '', 'Download KevFLIX-Setup-*.exe for Windows x64. It installs the PC control panel and private Python runtime. Processing dependencies and models are optional downloads from PC settings. Startup is enabled by default. Existing private settings and model files are preserved on upgrades.', '', 'Automatic desktop updates download in the background and install on the next KevFLIX start. TV interface updates activate between playback sessions. Installer is unsigned. See docs/INSTALL.md and docs/UPDATES.md.') | Set-Content -LiteralPath $notes
          gh release create $tag --target "$env:GITHUB_SHA" --title "KevFLIX $version development build $env:GITHUB_RUN_NUMBER" --prerelease --notes-file $notes "$env:RUNNER_TEMP/kevflix-build/KevFLIX-Setup-$version.exe" "$env:RUNNER_TEMP/kevflix-build/KevFLIX-Setup-$version.exe.sha256" "$env:RUNNER_TEMP/kevflix-build/desktop-release.json" "$env:RUNNER_TEMP/kevflix-build/KevFLIX-$version-unsigned.wgt" "$env:RUNNER_TEMP/kevflix-build/KevFLIX-$version-unsigned.wgt.sha256"
