<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KevFLIX</title><link rel="stylesheet" href="style.css"></head>
<body><main><small>KevFLIX · 0.4.2</small><h1 id="welcome">KevFLIX</h1>
<p id="instructions" hidden>Enter the worker address shown in KevFLIX PC. It will be remembered for future launches.</p>
<form id="connect" novalidate hidden><label>PC worker address<input id="address" type="text" placeholder="Enter the worker URL shown on your PC" autocomplete="off" required></label><button id="open-player" type="button">Open KevFLIX</button></form>
<p id="message" role="status">Opening your home screen…</p><button id="change-address" type="button" hidden>Change PC address</button><p class="muted">Your movies and English audio stay on the LAN. The worker must be running on your PC.</p></main>
<script src="bootstrap.js"></script></body></html>
