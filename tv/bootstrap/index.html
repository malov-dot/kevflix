<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KevFLIX</title><link rel="stylesheet" href="style.css"></head>
<body><main><small>KevFLIX · 0.3.1</small><h1>Your movies.<br>Your language.</h1>
<p>Connect directly to the Movie Dub worker on your home network.</p>
<form id="connect" novalidate><label>PC worker address<input id="address" type="text" placeholder="Enter the worker URL shown on your PC" autocomplete="off" required></label><button id="open-player" type="button">Open KevFLIX</button></form>
<p id="message" role="status"></p><p class="muted">Your movies and English audio stay on the LAN. The worker must be running on your PC.</p></main>
<script src="bootstrap.js"></script></body></html>
